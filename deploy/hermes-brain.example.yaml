# Merge this into Porteiro and Cadastro worker Profile configurations.
# Keep the actual BRAIN_TOKEN in that Profile's secret scope; do not commit it.
mcp_servers:
  brain:
    url: "http://127.0.0.1:8765/mcp"
    headers:
      Authorization: "Bearer ${BRAIN_TOKEN}"
      X-Hermes-Task: "${HERMES_KANBAN_TASK}"
      X-Hermes-Run: "${HERMES_KANBAN_RUN_ID}"
    tools:
      include:
        - conversation_phone
    resources: false
    prompts: false

# Keep Brain and the existing FamaChat MCP server available on CLI. Explicit
# MCP names form an allowlist in Hermes, so omitting FamaChat would hide it.
# Explicitly disable all MCP servers on Telegram/WhatsApp.
platform_toolsets:
  cli:
    - clarify
    - brain
    - famachat
  telegram:
    - clarify
    - no_mcp
  whatsapp:
    - clarify
    - no_mcp
