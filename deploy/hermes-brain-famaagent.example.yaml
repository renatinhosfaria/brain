# Merge this template into the FamaAgent worker Profile configuration.
# Keep the actual BRAIN_TOKEN in that Profile's secret scope; do not commit it.
mcp_servers:
  brain:
    url: "http://127.0.0.1:8765/mcp"
    headers:
      Authorization: "Bearer ${BRAIN_TOKEN}"
      X-Hermes-Task: "${HERMES_KANBAN_TASK}"
      X-Hermes-Run: "${HERMES_KANBAN_RUN_ID}"
    tools:
      include:
        - conversation_recent
        - conversation_search
    resources: false
    prompts: false

# Keep Brain and the existing FamaChat MCP server available on CLI. Explicit
# MCP names form an allowlist in Hermes, so omitting FamaChat would hide it.
# Since Amendment 4 (spec 12.5) FamaAgent carries the read-only FamaChat
# allowlist; its endpoint, credential and exact tool names stay in the Profile
# configuration, never here. No write tool is granted: 12.3's nominal
# fc_patch_clientes_by_id exception belongs to Reno alone.
# Explicitly disable all MCP servers on Telegram/WhatsApp.
platform_toolsets:
  cli:
    - clarify
    - brain
    - famachat
  telegram:
    - clarify
    - no_mcp
  whatsapp:
    - clarify
    - no_mcp
