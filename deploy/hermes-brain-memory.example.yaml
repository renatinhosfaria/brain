# Merge this template into Reno and FamaAgent worker Profile configurations.
# Keep the actual BRAIN_TOKEN in that Profile's secret scope; do not commit it.
mcp_servers:
  brain:
    url: "http://127.0.0.1:8765/mcp"
    headers:
      Authorization: "Bearer ${BRAIN_TOKEN}"
      X-Hermes-Task: "${HERMES_KANBAN_TASK}"
      X-Hermes-Run: "${HERMES_KANBAN_RUN_ID}"
    tools:
      include:
        - conversation_recent
        - conversation_search
    resources: false
    prompts: false

# Keep Brain out of Telegram and WhatsApp. no_mcp prevents inheritance from
# globally enabled MCP servers while leaving Brain available to CLI workers.
platform_toolsets:
  cli:
    - clarify
    - brain
  telegram:
    - clarify
    - no_mcp
  whatsapp:
    - clarify
    - no_mcp
