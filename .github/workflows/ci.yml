name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts integrations
      - run: PYTHONPATH=src .venv/bin/python -m unittest discover -s tests -v
      - run: npm ci
        working-directory: observers/whatsapp
      - run: npm test
        working-directory: observers/whatsapp
      - run: uv build
      # Formatacao por ultimo, de proposito. Este passo e o unico puramente
      # cosmetico, e enquanto ele rodava antes dos testes uma divergencia de
      # quebra de linha apagava a verificacao inteira: entre 31/08 e 04/09 o
      # CI falhou dez vezes seguidas aqui e os 767 testes nunca chegaram a
      # rodar. Continua obrigatorio -- so nao decide mais se o resto executa.
      # `ruff check` fica antes porque acusa defeito real, nao estilo.
      - run: uv run ruff format --check src tests scripts integrations
